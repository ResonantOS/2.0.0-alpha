<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>External Agent Runtimes — Dev Panel</title>
  <style>
    :root { color-scheme: light dark; --bg: #0e1116; --fg: #e6edf3; --muted: #8b949e; --ok: #3fb950; --fail: #f85149; --card: #161b22; --border: #30363d; }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 24px; }
    h1 { margin: 0 0 4px 0; font-size: 22px; }
    .subtitle { color: var(--muted); margin: 0 0 24px 0; }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .addon { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .addon h2 { margin: 0 0 4px 0; font-size: 16px; }
    .addon .file { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .addon .row { display: grid; grid-template-columns: 160px 1fr; gap: 8px; margin: 4px 0; font-size: 13px; }
    .addon .row .k { color: var(--muted); }
    .addon .row .v { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .trigger { color: var(--ok); }
    .no-trigger { color: var(--muted); }
    .err { color: var(--fail); margin: 4px 0; font-size: 13px; }
  </style>
</head>
<body>
  <h1>External Agent Runtimes</h1>
  <p class="subtitle">Dev-only panel. Enumerates <code>examples/addons/*.json</code> as discovered by the running bridge. Run <code>npm run deepseek-harness:smoke</code> for F1–F10 boundary-contract verdicts.</p>
  <div class="meta" id="meta"></div>
  <div id="root"></div>

  <!-- Server-injected by dev-external-agent-runtimes-panel.mjs: the token is
       replaced with an inert JSON literal at request time. type="application/json"
       means the browser never executes this block — it is inert data read via
       textContent + JSON.parse, so no JavaScript parsing of the payload occurs
       and no executable-context escaping (U+2028/U+2029) is required. -->
  <script type="application/json" id="panel-data">__EXTERNAL_AGENT_RUNTIMES_DATA__</script>

  <script>
    (function () {
      var root = document.getElementById("root");
      var meta = document.getElementById("meta");
      var data = {};
      try {
        data = JSON.parse(document.getElementById("panel-data").textContent) || {};
      } catch (error) {
        data = { error: "panel data failed to parse: " + (error && error.message ? error.message : String(error)) };
      }

      // Build a label/value row with DOM APIs only — no innerHTML for untrusted
      // values, so a manifest field can never inject markup.
      function row(label, value, className) {
        var div = document.createElement("div");
        div.className = "row";
        var k = document.createElement("span");
        k.className = "k";
        k.textContent = label;
        var v = document.createElement("span");
        v.className = "v" + (className ? " " + className : "");
        v.textContent = value == null ? "" : String(value);
        div.appendChild(k);
        div.appendChild(v);
        return div;
      }

      function renderAddon(addon) {
        var card = document.createElement("div");
        card.className = "addon";

        var h2 = document.createElement("h2");
        h2.textContent = addon.name || addon.id || addon.fileName;
        card.appendChild(h2);

        var file = document.createElement("div");
        file.className = "file";
        file.textContent = addon.fileName + (addon.version ? " · v" + addon.version : "");
        card.appendChild(file);

        if (addon.error) {
          var err = document.createElement("div");
          err.className = "err";
          err.textContent = addon.error;
          card.appendChild(err);
          return card;
        }

        card.appendChild(row("id", addon.id || "(missing)"));
        card.appendChild(row("runtimeType", addon.runtimeType || "(missing)"));
        card.appendChild(row("service.entrypoint", addon.serviceEntrypoint || "(none)"));
        card.appendChild(row("tools", (addon.tools && addon.tools.length ? addon.tools.join(", ") : "—")));
        card.appendChild(row("§3 trigger", addon.hasTrigger ? "providers + agent-delegation" : "—", addon.hasTrigger ? "trigger" : "no-trigger"));
        return card;
      }

      meta.textContent = "generated at " + (data.generatedAt || "?") + " · " + ((data.addons && data.addons.length) || 0) + " addon(s)";

      if (data.error) {
        var dirErr = document.createElement("div");
        dirErr.className = "err";
        dirErr.textContent = data.error;
        root.appendChild(dirErr);
        return;
      }

      var addons = data.addons || [];
      if (addons.length === 0) {
        var empty = document.createElement("p");
        empty.className = "meta";
        empty.textContent = "No addon manifests under examples/addons/.";
        root.appendChild(empty);
        return;
      }

      for (var i = 0; i < addons.length; i++) {
        root.appendChild(renderAddon(addons[i]));
      }
    })();
  </script>
</body>
</html>
